<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sphere Lab — Prisca Dezigns</title><style>html,body{margin:0;min-height:100%;background:#fff;color:#2a1732;font-family:Arial,sans-serif}body{display:grid;place-items:center;overflow:hidden}.wrap{width:100vw;height:100vh;position:relative}.label{position:absolute;left:clamp(24px,6vw,90px);top:clamp(24px,6vw,80px);z-index:2;text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:#743089}.note{position:absolute;left:clamp(24px,6vw,90px);bottom:28px;z-index:2;font-size:12px;color:#8a7c90;letter-spacing:.04em}.stage{position:absolute;inset:0}canvas{display:block;width:100%;height:100%}</style></head><body><main class="wrap"><div class="label">Sphere study · 01</div><div class="note">A contained geometric system · drag to explore</div><div class="stage" id="stage"></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>
const stage=document.getElementById('stage');const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,100);camera.position.set(0,0,7.2);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;stage.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,1.8));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(4,5,7);scene.add(key);const fill=new THREE.DirectionalLight(0xd6a5e6,2);fill.position.set(-5,-2,4);scene.add(fill);
const system=new THREE.Group();scene.add(system);const cubeGeo=new THREE.BoxGeometry(.43,.43,.43);const colors=[0x743089,0x9e55b5,0xc98ada,0xf0d6f5,0x5d236d];
for(let x=-2;x<=2;x++)for(let y=-2;y<=2;y++)for(let z=-2;z<=2;z++){const d=Math.sqrt(x*x+y*y+z*z);if(d>2.45)continue;const m=new THREE.MeshStandardMaterial({color:colors[(x*3+y*5+z*7+30)%colors.length],roughness:.28,metalness:.04});const c=new THREE.Mesh(cubeGeo,m);c.position.set(x*.48,y*.48,z*.48);c.rotation.set((y+z)*.035,(x-z)*.035,(x+y)*.025);system.add(c)}
const shell=new THREE.Mesh(new THREE.SphereGeometry(1.48,48,48),new THREE.MeshPhysicalMaterial({color:0xb86bd0,transparent:true,opacity:.14,roughness:.15,metalness:0,transmission:.55,thickness:.4,side:THREE.DoubleSide,depthWrite:false}));system.add(shell);
const edge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(1.5,2)),new THREE.LineBasicMaterial({color:0x743089,transparent:true,opacity:.28}));system.add(edge);
const halo=new THREE.Mesh(new THREE.TorusGeometry(1.72,.018,12,128),new THREE.MeshBasicMaterial({color:0xc98ada,transparent:true,opacity:.38}));halo.rotation.x=.92;halo.rotation.z=-.3;system.add(halo);
let targetX=.0,targetY=.0,drag=false,lastX=0,lastY=0;addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;targetY+=(e.clientX-lastX)*.006;targetX+=(e.clientY-lastY)*.006;lastX=e.clientX;lastY=e.clientY});
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();system.rotation.y+=(targetY-system.rotation.y)*.06+.0018;system.rotation.x+=(targetX-system.rotation.x)*.06;halo.rotation.z+=.002;for(let i=0;i<system.children.length-3;i++){const c=system.children[i];c.position.y+=Math.sin(t*1.2+i*.17)*.00025}renderer.render(scene,camera)}animate();
</script></body></html>
